<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback líder SLA</title><style>body{margin:0;background:linear-gradient(180deg,#ccfbf1,#f0fdfa);font-family:Segoe UI,Arial;color:#172033}.wrap{max-width:720px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:16px}.id{padding:12px;border:1px solid #99f6e4;background:#f0fdfa;border-radius:8px;font-weight:800}textarea{width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font:inherit;box-sizing:border-box}button{margin-top:14px;padding:12px 18px;border:0;border-radius:8px;background:#0d9488;color:#fff;font-weight:800}</style></head><body><main class="wrap"><div id="load" class="card">Cargando…</div><div id="app" style="display:none"><section class="card"><h2>Caso <span id="case"></span></h2><p id="client"></p><p id="state"></p></section><section class="card"><h3>Observaciones anteriores</h3><div id="hist"></div><p style="margin-top:18px"><b>Identificado automáticamente como</b></p><div id="who" class="id"></div><p style="margin-top:18px"><b>Tu observación</b></p><textarea id="obs"></textarea><button id="save">Guardar y avisar al agente</button><p id="msg"></p></section></div></main><script>
const API='https://erjmqjcjggxbktxcogkm.supabase.co/functions/v1/observacion-lider-api';
const token=new URLSearchParams(location.search).get('token');
async function getCtx(){const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'No fue posible abrir el enlace');return j.data}
async function postObs(obs){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'guardar_observacion',token,observacion:obs})}),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'No fue posible guardar');}
async function init(){try{if(!token)throw new Error('El enlace no contiene un token válido.');const d=await getCtx();if(d.vista!=='lider')throw new Error('Vista no válida');document.getElementById('case').textContent=d.case_id||'—';document.getElementById('client').textContent=(d.cliente_nombre||'Cliente no informado')+' · '+(d.pais||'');document.getElementById('state').textContent='Estado actual: '+(d.estado_actual||'—');document.getElementById('who').textContent=(d.autor_nombre||d.autor_correo||'Usuario')+' · '+(d.autor_correo||'')+' · '+(d.autor_rol||'');const h=document.getElementById('hist'),items=d.observaciones||[];h.innerHTML=items.length?items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid #e2e8f0"><b>'+(x.autor_correo||x.autor_rol||'')+'</b><br>'+(x.observacion||'')+'</div>').join(''):'<p style="color:#64748b">Aún no hay observaciones para este caso.</p>';document.getElementById('load').style.display='none';document.getElementById('app').style.display='block'}catch(e){document.getElementById('load').textContent=e.message}}
document.getElementById('save').onclick=async()=>{const o=document.getElementById('obs').value.trim(),m=document.getElementById('msg');if(o.length<3){m.textContent='Escribe una observación válida.';return}try{await postObs(o);m.textContent='Observación guardada. Se avisó al agente.';document.getElementById('obs').value=''}catch(e){m.textContent=e.message}};
init();</script></body></html>
