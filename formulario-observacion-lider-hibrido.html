<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback SLA</title>
<style>body{margin:0;background:#e6fffb;font-family:Segoe UI,Arial;color:#172033}.w{max-width:720px;margin:24px auto;padding:0 16px}.c{background:#fff;border:1px solid #dbe5ea;border-radius:14px;padding:20px;margin-bottom:16px}.id{padding:12px;border:1px solid #99f6e4;background:#f0fdfa;border-radius:8px;font-weight:800}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:120px}button{margin-top:12px;padding:11px 16px;border:0;border-radius:8px;background:#0d9488;color:white;font-weight:800}.link{background:none;color:#0f766e;text-decoration:underline;padding:0}.hide{display:none}.muted{color:#64748b}.msg{font-weight:700}</style>
<body><main class="w"><div id="load" class="c">Cargando…</div><div id="app" class="hide">
<section class="c"><h2>Caso <span id="case"></span></h2><p id="client"></p><p id="state" class="muted"></p></section>
<section class="c"><h3>Observaciones anteriores</h3><div id="hist"></div>
<div id="owner"><p class="muted"><b>Identificado automáticamente como</b></p><div id="who" class="id"></div><button id="other" class="link" type="button">No soy esta persona / Dar feedback como otra persona</button></div>
<div id="alt" class="hide"><p><b>Verifica tu correo corporativo</b></p><p class="muted">Solo @red.com.gt o @red.com.sv</p><input id="email" type="email" placeholder="usuario@red.com.gt"><button id="send" type="button">Enviar enlace de verificación</button><p id="verify" class="msg"></p><div id="verified" class="hide"><div id="verifiedWho" class="id"></div><button id="back" class="link" type="button">Volver a la identidad original</button></div></div>
<p><b>Tu observación</b></p><textarea id="obs"></textarea><button id="save">Guardar y avisar al agente</button><p id="msg" class="msg"></p></section></div></main>
<script>
const API='https://erjmqjcjggxbktxcogkm.supabase.co/functions/v1/observacion-lider-api',p=new URLSearchParams(location.search),token=p.get('token');let ctx=null,mode='owner',access=(new URLSearchParams(location.hash.slice(1))).get('access_token')||'';
async function req(body,auth){const h={'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+auth;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'Error');return j}
async function init(){try{const r=await fetch(API+'?token='+encodeURIComponent(token)),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'Error');ctx=j.data;caseEl.textContent=ctx.case_id||'—';client.textContent=(ctx.cliente_nombre||'')+' · '+(ctx.pais||'');state.textContent='Estado actual: '+(ctx.estado_actual||'—');who.textContent=(ctx.autor_nombre||ctx.autor_correo)+' · '+ctx.autor_correo+' · '+(ctx.autor_rol||'');hist.innerHTML=(ctx.observaciones||[]).map(x=>'<p><b>'+(x.autor_correo||x.autor_rol||'')+'</b><br>'+(x.observacion||'')+'</p>').join('')||'<p class="muted">Aún no hay observaciones para este caso.</p>';if(access){mode='other';owner.classList.add('hide');alt.classList.remove('hide');verified.classList.remove('hide');verifiedWho.textContent='Correo corporativo verificado';}load.classList.add('hide');app.classList.remove('hide')}catch(e){load.textContent=e.message}}
const caseEl=document.getElementById('case');
other.onclick=()=>{mode='other';owner.classList.add('hide');alt.classList.remove('hide')};back.onclick=()=>{mode='owner';alt.classList.add('hide');owner.classList.remove('hide')};
send.onclick=async()=>{try{const e=email.value.trim().toLowerCase();const red=location.origin+location.pathname+'?token='+encodeURIComponent(token)+'&modo=otro';await req({action:'solicitar_verificacion',token,email:e,redirect_to:red});verify.textContent='Te enviamos un enlace de verificación a '+e+'.';}catch(e){verify.textContent=e.message}};
save.onclick=async()=>{try{const o=obs.value.trim();if(o.length<3)throw new Error('Escribe una observación válida.');if(mode==='owner')await req({action:'guardar_observacion',token,observacion:o});else{if(!access)throw new Error('Primero verifica tu correo corporativo.');await req({action:'guardar_observacion_verificada',token,observacion:o},access)}msg.textContent='Observación guardada. Se avisó al agente.';obs.value=''}catch(e){msg.textContent=e.message}};init();
</script></body></html>
