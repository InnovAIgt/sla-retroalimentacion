<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Retroalimentación — Resumen ejecutivo</title>

  <style>
    :root {
      color-scheme: light;

      --body-bg: #f8fafc;
      --card-bg: #ffffff;
      --soft-bg: #f8fafc;
      --border: #e2e8f0;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --observation: #eab308;
      --shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;

      --body-bg: #0f172a;
      --card-bg: #172033;
      --soft-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --observation: #facc15;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--body-bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      transition: background 160ms ease, color 160ms ease;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      width: min(100% - 32px, 720px);
      min-height: 74px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .brand-name {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .theme-button {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }

    .container {
      width: min(100% - 32px, 720px);
      margin: 22px auto 50px;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .preoffer-number {
      color: var(--text);
    }

    .client-name {
      margin: 0 0 5px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.4;
    }

    .process-state {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .observation {
      padding: 13px 15px;
      border-left: 4px solid var(--observation);
      border-radius: 0 7px 7px 0;
      background: var(--soft-bg);
    }

    .observation-meta {
      margin: 0 0 7px;
      color: var(--observation);
      font-size: 12px;
      font-weight: 800;
    }

    .observation-text {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .feedback-list {
      display: grid;
      gap: 12px;
    }

    .feedback-item {
      padding: 13px 15px;
      border-left: 4px solid #60a5fa;
      border-radius: 0 7px 7px 0;
      background: var(--soft-bg);
    }

    .feedback-meta {
      margin: 0 0 7px;
      color: #3b82f6;
      font-size: 12px;
      font-weight: 800;
    }

    .feedback-text {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
    }

    .form-group {
      margin-top: 17px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft-bg);
      color: var(--text);
      outline: none;
      transition:
        border-color 150ms ease,
        box-shadow 150ms ease;
    }

    .input {
      height: 46px;
      padding: 0 13px;
    }

    .textarea {
      min-height: 120px;
      padding: 13px;
      resize: vertical;
      line-height: 1.55;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .input[readonly] {
      cursor: not-allowed;
      opacity: 0.82;
    }

    .submit-button {
      min-height: 46px;
      margin-top: 16px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:hover {
      background: var(--primary-hover);
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .message.success {
      display: block;
      border: 1px solid #86efac;
      background: #f0fdf4;
      color: #166534;
    }

    .message.error {
      display: block;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 22px, 720px);
        margin-top: 14px;
      }

      .header-inner {
        width: min(100% - 22px, 720px);
      }

      .card {
        padding: 17px;
      }

      .submit-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">◉</div>

        <div>
          <p class="brand-name">Red Intelfon</p>
          <p class="brand-subtitle">
            Retroalimentación — Resumen ejecutivo
          </p>
        </div>
      </div>

      <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="Cambiar tema"
        title="Cambiar tema"
      >
        ☾
      </button>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="card loading">
      Cargando información…
    </div>

    <div id="content" class="hidden">
      <section class="card">
        <h1 class="card-title">
          <span style="color:#06b6d4">◎</span>
          <span>
            Pre-oferta
            <span id="preofferNumber" class="preoffer-number"></span>
          </span>
        </h1>

        <p id="clientName" class="client-name"></p>
        <p id="processState" class="process-state"></p>
      </section>

      <section id="observationsCard" class="card hidden">
        <h2 class="card-title">
          <span>👁</span>
          <span>
            Observaciones
            (<span id="observationsCount">0</span>)
          </span>
        </h2>

        <div id="observationsList"></div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <span style="color:#3b82f6">□</span>
          <span>Retroalimentación</span>
        </h2>

        <div id="feedbackList" class="feedback-list"></div>

        <form id="feedbackForm">
          <div class="form-group">
            <label class="label" for="email">
              Correo que quedará registrado
            </label>

            <input
              id="email"
              class="input"
              type="email"
              autocomplete="email"
              placeholder="Tu correo"
              readonly
              required
            >
          </div>

          <div class="form-group">
            <label class="label" for="comment">
              Escribí tu retroalimentación
            </label>

            <textarea
              id="comment"
              class="textarea"
              maxlength="3000"
              placeholder="Podés comentar las veces que querás; cada comentario quedará guardado para los próximos resúmenes."
              required
            ></textarea>
          </div>

          <button id="submitButton" class="submit-button" type="submit">
            ✈ Guardar retroalimentación
          </button>

          <div id="message" class="message" role="status"></div>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
    const SUPABASE_ANON_KEY = "TU_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const emailFromUrl = (params.get("correo") || "").trim().toLowerCase();

    const loading = document.getElementById("loading");
    const content = document.getElementById("content");
    const form = document.getElementById("feedbackForm");
    const emailInput = document.getElementById("email");
    const commentInput = document.getElementById("comment");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const themeButton = document.getElementById("themeButton");

    function escapeHtml(value) {
      const element = document.createElement("div");
      element.textContent = String(value ?? "");
      return element.innerHTML;
    }

    function formatDate(value) {
      if (!value) return "";

      return new Intl.DateTimeFormat("es-SV", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "America/El_Salvador"
      }).format(new Date(value));
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("feedback-theme", theme);
      themeButton.textContent = theme === "dark" ? "☀" : "☾";
    }

    themeButton.addEventListener("click", () => {
      const current =
        document.documentElement.dataset.theme === "dark"
          ? "dark"
          : "light";

      applyTheme(current === "dark" ? "light" : "dark");
    });

    // El formulario siempre inicia claro la primera vez.
    applyTheme(localStorage.getItem("feedback-theme") || "light");

    function renderContext(context) {
      document.getElementById("preofferNumber").textContent =
        context.numero_preoferta || "—";

      document.getElementById("clientName").textContent =
        `${context.cliente_nombre || "Cliente sin nombre"} · ${context.pais || "—"}`;

      document.getElementById("processState").textContent =
        `Estado: en fase ${context.estado_actual || "—"} · Etapa actual: ${context.numero_etapa || "—"}`;

      renderObservations(context.observaciones || []);
      renderFeedback(context.retroalimentaciones || []);

      emailInput.value = emailFromUrl || context.correo_destinatario || "";

      loading.classList.add("hidden");
      content.classList.remove("hidden");
    }

    function renderObservations(observations) {
      const card = document.getElementById("observationsCard");
      const list = document.getElementById("observationsList");
      const count = document.getElementById("observationsCount");

      count.textContent = observations.length;
      list.innerHTML = "";

      if (!observations.length) {
        card.classList.add("hidden");
        return;
      }

      card.classList.remove("hidden");

      for (const observation of observations) {
        const item = document.createElement("article");
        item.className = "observation";

        const meta = document.createElement("p");
        meta.className = "observation-meta";
        meta.textContent =
          `${observation.estado === "pendiente" ? "EN OBSERVACIÓN" : "OBSERVACIÓN"} · ` +
          `Etapa ${observation.numero_etapa || "—"} · ` +
          formatDate(observation.creado_en);

        const text = document.createElement("p");
        text.className = "observation-text";

        const parts = [];

        if (observation.justificacion) {
          parts.push(`Justificación: "${observation.justificacion}"`);
        }

        if (observation.plan_seguimiento) {
          parts.push(`Plan de seguimiento: "${observation.plan_seguimiento}"`);
        }

        text.textContent = parts.join("\n");

        item.append(meta, text);
        list.appendChild(item);
      }
    }

    function renderFeedback(feedbackItems) {
      const list = document.getElementById("feedbackList");
      list.innerHTML = "";

      if (!feedbackItems.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Aún no hay comentarios.";
        list.appendChild(empty);
        return;
      }

      for (const feedback of feedbackItems) {
        const item = document.createElement("article");
        item.className = "feedback-item";

        const meta = document.createElement("p");
        meta.className = "feedback-meta";
        meta.textContent =
          `${feedback.autor_email} · ${formatDate(feedback.creado_en)}`;

        const text = document.createElement("p");
        text.className = "feedback-text";
        text.textContent = `"${feedback.comentario}"`;

        item.append(meta, text);
        list.appendChild(item);
      }
    }

    async function loadContext() {
      if (!token) {
        loading.textContent =
          "El enlace no contiene un token de retroalimentación.";
        return;
      }

      const { data, error } = await supabaseClient.rpc(
        "obtener_contexto_retroalimentacion",
        {
          p_token: token
        }
      );

      if (error) {
        console.error(error);
        loading.textContent =
          "No fue posible abrir este enlace de retroalimentación.";
        return;
      }

      if (!data || data.error) {
        loading.textContent =
          data?.error || "El enlace no existe o ya no está disponible.";
        return;
      }

      renderContext(data);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const comment = commentInput.value.trim();

      if (!email) {
        showMessage("No encontramos el correo del destinatario.", "error");
        return;
      }

      if (comment.length < 3) {
        showMessage(
          "Escribí una retroalimentación de al menos 3 caracteres.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Guardando…";

      try {
        const { data, error } = await supabaseClient.rpc(
          "guardar_retroalimentacion",
          {
            p_token: token,
            p_correo: email,
            p_comentario: comment
          }
        );

        if (error) throw error;
        if (!data?.ok) throw new Error(data?.error || "No se pudo guardar.");

        commentInput.value = "";

        showMessage(
          "Retroalimentación guardada correctamente.",
          "success"
        );

        await loadContext();

        console.error(error);

        showMessage(
          error.message || "No fue posible guardar la retroalimentación.",
          "error"
        );
