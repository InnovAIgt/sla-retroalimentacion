<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feedback del líder — SLA</title>
<style>
:root{--bg:linear-gradient(180deg,#ccfbf1 0%,#f0fdfa 55%,#cffafe 100%);--card:#fff;--border:#e2e8f0;--text:#172033;--muted:#64748b;--primary:#0d9488;--soft:#f0fdfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.header{background:var(--primary)}.inner,.container{width:min(100% - 32px,720px);margin:auto}.inner{min-height:78px;display:flex;align-items:center;gap:12px;color:white}.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:4px}.container{margin-top:22px;margin-bottom:50px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px rgba(15,23,42,.09)}
h1,h2,p{margin-top:0}.muted{color:var(--muted)}.identity{padding:12px 13px;border:1px solid #99f6e4;border-radius:8px;background:var(--soft);font-weight:800;line-height:1.5}
textarea{width:100%;min-height:120px;padding:13px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font:inherit;resize:vertical}
button{min-height:46px;margin-top:16px;padding:0 20px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer}.item{padding:12px 14px;border-left:4px solid #2dd4bf;background:var(--soft);margin-top:10px}.msg{margin-top:14px;font-weight:700}.ok{color:#166534}.err{color:#b91c1c}.hidden{display:none}
</style>
</head>
<body>
<header class="header"><div class="inner"><img src="logo.png" class="logo" alt="RED"><div><div style="font-weight:800">Red Intelfon</div><div style="font-size:11px;opacity:.85">Observación de caso — Sistema de monitoreo de SLA</div></div></div></header>
<main class="container">
<div id="loading" class="card">Cargando información…</div>
<div id="content" class="hidden">
<section class="card"><h1 style="font-size:18px">Caso <span id="case"></span></h1><p id="cliente" style="font-weight:800"></p><p id="estado" class="muted"></p></section>
<section class="card">
<h2 style="font-size:17px">Observaciones anteriores</h2><div id="historial"></div>
<div style="margin-top:18px"><div class="muted" style="font-size:13px;font-weight:700;margin-bottom:7px">Identificado automáticamente como</div><div id="identidad" class="identity"></div></div>
<div style="margin-top:18px"><label for="obs" style="display:block;font-size:13px;font-weight:700;margin-bottom:7px">Tu observación</label><textarea id="obs" maxlength="3000" placeholder="Escribe aquí tu observación sobre este caso. Se le avisará por correo al agente responsable."></textarea></div>
<button id="guardar">Guardar y avisar al agente</button><div id="msg" class="msg"></div>
</section>
</div>
</main>
<script>
const API='https://erjmqjcjggxbktxcogkm.supabase.co/functions/v1/observacion-lider-api';
const p=new URLSearchParams(location.search),token=p.get('token'),correo=(p.get('correo')||'').trim(),nombre=(p.get('nombre')||'').trim(),rol=(p.get('rol')||'').trim();
const loading=document.getElementById('loading'),content=document.getElementById('content');
function fd(v){if(!v)return'';return new Intl.DateTimeFormat('es-GT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}
async function apiGet(){const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'No fue posible abrir este enlace.');return j.data}
async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j?.ok)throw new Error(j?.error||'No fue posible completar la acción.');return j}
async function init(){try{if(!token||!correo)throw new Error('El enlace no contiene la identificación necesaria.');const d=await apiGet();if(d?.vista!=='lider')throw new Error('Este enlace no corresponde a la vista del líder.');document.getElementById('case').textContent=d.case_id||'—';document.getElementById('cliente').textContent=(d.cliente_nombre||'Cliente no informado')+' · '+(d.pais||'');document.getElementById('estado').textContent='Estado actual: '+(d.estado_actual||'—');document.getElementById('identidad').textContent=(nombre||correo)+' · '+correo+(rol?' · '+rol:'');const h=document.getElementById('historial'),items=d.observaciones||[];if(!items.length)h.innerHTML='<p class="muted">Aún no hay observaciones para este caso.</p>';else items.forEach(it=>{const x=document.createElement('div');x.className='item';x.textContent=(it.autor_correo||it.autor_rol||'')+' · '+fd(it.creado_en)+' — '+(it.observacion||'');h.appendChild(x)});loading.classList.add('hidden');content.classList.remove('hidden')}catch(e){loading.textContent=e.message||'No fue posible abrir este enlace.'}}
document.getElementById('guardar').onclick=async()=>{const obs=document.getElementById('obs').value.trim(),m=document.getElementById('msg'),b=document.getElementById('guardar');m.textContent='';m.className='msg';if(obs.length<3){m.textContent='Escribe una observación de al menos 3 caracteres.';m.classList.add('err');return}b.disabled=true;b.textContent='Guardando…';try{await apiPost({action:'guardar_observacion',token,correo,observacion:obs});document.getElementById('obs').value='';m.textContent='Observación guardada. Se le avisó al agente por correo.';m.classList.add('ok')}catch(e){m.textContent=e.message||'No fue posible guardar la observación.';m.classList.add('err')}finally{b.disabled=false;b.textContent='Guardar y avisar al agente'}};
init();
</script>
</body></html>
